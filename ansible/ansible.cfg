[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Without this, a handler already notified by an earlier task is silently
# dropped if that same host fails a later task in the same play -- exactly
# what happened here: app-1's queued "Reload Nginx" handler was lost when
# the migration task failed right after, on the same host, in the same run.
force_handlers = True

[ssm_connection]
retries = 3
