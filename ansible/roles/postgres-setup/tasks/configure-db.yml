---
- name: Configure PostgreSQL to listen on all interfaces
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
  notify: Restart PostgreSQL

- name: Allow app instances to connect to PostgreSQL
  become: true
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_dir }}/pg_hba.conf"
    line: "host all all {{ postgres_allowed_cidr }} scram-sha-256"
  notify: Reload PostgreSQL

- name: Create PostgreSQL database user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    password: "{{ db_password }}"
    encrypted: true
    state: present
  no_log: true

- name: Create PostgreSQL database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
    state: present
