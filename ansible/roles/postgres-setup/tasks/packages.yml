---
- name: Install PostgreSQL server packages
  ansible.builtin.dnf:
    name: "{{ postgres_packages }}"
    state: present

- name: Install pip so Ansible's PostgreSQL modules can run
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: Install psycopg2 for the Ansible control connection to PostgreSQL
  ansible.builtin.pip:
    name: psycopg2-binary
    state: present
    executable: pip3
