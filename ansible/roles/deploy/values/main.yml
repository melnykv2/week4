---
# NOTE: Ansible does NOT auto-load a role's values/ directory the way it does
# defaults/main.yml or vars/main.yml. This file is documentation only — it
# records the external variable contract this role depends on, and where each
# variable actually comes from, so the role's own tasks stay free of
# hardcoded, environment-specific values.
#
# Provided by Terraform's generated inventory (ssm.tf -> inventory.ini):
#   db_private_ip           - the db instance's private IP, exposed under
#                              [webservers:vars] and aliased to `db_host`
#
# Provided by group_vars/webservers.yml (shared with the webserver-setup role):
#   app_user, app_group, app_dir, venv_dir, app_service_name
#   app_bind_host, app_bind_port
#   allowed_hosts, site_root
#   db_host, db_name, db_user, db_password, db_port
#
# Provided by group_vars/all/vars.yml:
#   postgres_db, postgres_user, postgres_port
#   postgres_password, django_secret_key
#     (both resolved via an amazon.aws.ssm_parameter lookup against
#      SecureString parameters Terraform creates in secrets.tf; the
#      parameter names themselves come from the Terraform-generated
#      inventory as db_password_parameter / django_secret_parameter)
#
# Provided by this role's own defaults/main.yml (safe to override per-environment):
#   app_repo_url, app_branch, python_venv_python, gunicorn_workers
