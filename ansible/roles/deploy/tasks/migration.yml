---
- name: Run Django database migrations
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: "{{ venv_dir }}/bin/python manage.py migrate"
    chdir: "{{ app_dir }}"
  environment:
    DB: postgres
    DB_NAME: "{{ postgres_db_name }}"
    DB_HOST: "{{ db_host }}"
    DB_PORT: "5432"
    DB_USER: "{{ postgres_db_user }}"
    DB_PASSWORD: "{{ db_password }}"
    SECRET_KEY: "{{ django_secret_key }}"
    DEBUG: "False"
    SITE_ROOT: "http://{{ alb_dns_name }}"
  register: migration_result
  changed_when: "'No migrations to apply' not in migration_result.stdout"
  run_once: true
  no_log: true

- name: Collect static files
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: "{{ venv_dir }}/bin/python manage.py collectstatic --noinput"
    chdir: "{{ app_dir }}"
  environment:
    DB: postgres
    DB_NAME: "{{ postgres_db_name }}"
    DB_HOST: "{{ db_host }}"
    DB_PORT: "5432"
    DB_USER: "{{ postgres_db_user }}"
    DB_PASSWORD: "{{ db_password }}"
    SECRET_KEY: "{{ django_secret_key }}"
    DEBUG: "False"
    SITE_ROOT: "http://{{ alb_dns_name }}"
    ALLOWED_HOSTS: "*"
  register: collectstatic_result
  changed_when: "'0 static files copied' not in collectstatic_result.stdout"
  no_log: true

- name: Compress static assets
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: "{{ venv_dir }}/bin/python manage.py compress --force"
    chdir: "{{ app_dir }}"
  environment:
    DB: postgres
    DB_NAME: "{{ postgres_db_name }}"
    DB_HOST: "{{ db_host }}"
    DB_PORT: "5432"
    DB_USER: "{{ postgres_db_user }}"
    DB_PASSWORD: "{{ db_password }}"
    SECRET_KEY: "{{ django_secret_key }}"
    DEBUG: "False"
    SITE_ROOT: "http://{{ alb_dns_name }}"
    ALLOWED_HOSTS: "*"
  no_log: true
