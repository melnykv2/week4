---
- name: Install acl
  become: true
  ansible.builtin.apt:
    name:
      - acl
      - libpq5
    state: present

- name: Create django application user
  become: true
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: Create application directory
  become: true
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Clone application code
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.git:
    repo: "https://github.com/kaaalim/django-sample-app.git"
    dest: "{{ app_dir }}"
    version: main
    force: true

- name: Install Python dependencies
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_command: "python3.12 -m venv"

- name: Install gunicorn
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: "{{ venv_dir }}"
